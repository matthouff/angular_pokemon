<div class="auth-form-component">
  <h1>Inscription</h1>
  <form (ngSubmit)="onSubmit()" #codeForm="ngForm">

    <div class="label-input">
      <label for="code">Code</label>
      <input (change)="onChange(code.value)" id="code" type="string" #code name="code">
    </div>

    <button [disabled]="!codeForm.form.valid" class="submit" type="submit">Connexion</button>
    <a (click)="goBack()">Retour</a>
  </form>
</div>
